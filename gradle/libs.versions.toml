[versions]
# Project versions
projectApplicationId = "com.jm.harufocus"

# App Version Name (Manual Management)
# This allows flexible naming like "1.0.0-beta01", "1.0.0-rc01", "1.0.0"
projectVersionName = "1.1.0"

# App Version Code Components (Automated Calculation)
# Rule: Major(2) + Minor(2) + Patch(2) + Build(2) -> XXYYZZBB
# Example: 1.0.0 (Build 1) -> 1000001
appVersion-major = "1"
appVersion-minor = "1"
appVersion-patch = "0"
appVersion-build = "1"

projectMinSdkVersion = "26"
projectTargetSdkVersion = "36"
projectCompileSdkVersion = "36"

# NDK
ndk = "27.0.12077973"

agp = "9.0.1"
kotlin = "2.3.10"
coreKtx = "1.17.0"
coreSplashscreen = "1.2.0"
lifecycleRuntimeKtx = "2.10.0"

activityCompose = "1.12.3"
composeBom = "2026.01.01"
androidxComposeMaterial3 = "1.4.0"
androidxComposeNavigation = "2.9.7"

kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.7.1"
dataStore = "1.2.0"

hilt = "2.59.1"
hiltNavigationCompose = "1.3.0"
ksp = "2.3.4"
room = "2.8.4"

# LogUtil Library
jmlogVer = "1.0.1"

# Vico Chart Library
vico = "2.4.3"

appcompat = "1.7.1"
material = "1.13.0"
jetbrainsKotlinJvm = "2.3.10"

# Jetpack Glance
glance = "1.1.1"

# Work Manager
androidxWork = "2.11.1"

baselineprofile = "1.5.0-alpha02"

# Firebase Crashlytics
googleServices = "4.4.4"
firebaseCrashlyticsPlugin = "3.0.6"
firebaseBom = "34.9.0"

# Google Play OSS Licenses
ossLicenses = "17.4.0"
ossLicensesPlugin = "0.10.10"

# Google Play In-App Review
playReview = "2.0.2"

# Testing
junit4 = "4.13.2"
junitJupiter = "6.0.2"
junitVintageEngine = "6.0.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotest = "6.1.3"
mockk = "1.14.9"
turbine = "1.2.1"
truth = "1.4.5"
robolectric = "4.16.1"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"
materialVersion = "1.13.0"
activityKtx = "1.12.3"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Android Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx"}
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxComposeMaterial3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxComposeNavigation" }

# DataStore
androidx-dataStore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }
androidx-dataStore-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "dataStore" }

# Kotlin Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Kotlin Reflection
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# LogUtil library
jmlog = { group = "com.github.bellmin0203", name = "jmlog", version.ref = "jmlogVer" }

# Vico Chart
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
vico-core = { group = "com.patrykandpatrick.vico", name = "core", version.ref = "vico" }

# Hilt
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt"}
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt"}
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Glance
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance"}
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance"}
glance-preview = { group = "androidx.glance", name = "glance-preview", version.ref = "glance" }
glance-appwidget-preview = { group = "androidx.glance", name = "glance-appwidget-preview", version.ref = "glance" }

# Work Manager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }

# Firebase Crashlytics
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# Google Play OSS Licenses
play-services-oss-licenses = { group = "com.google.android.gms", name = "play-services-oss-licenses", version.ref = "ossLicenses"}

# Google Play In-App Review
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }

# === 단위 테스트 (Unit Test) ===
# JUnit4 - 기본 테스트 프레임워크
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintageEngine" }

# Kotlin Coroutines Test - 코루틴 테스트 지원
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# MockK - Kotlin용 Mocking 라이브러리
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }

# Turbine - Flow 테스트를 쉽게 해주는 라이브러리
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Google Truth - 읽기 쉬운 어설션 라이브러리
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

# Kotest - Kotlin 스타일 테스트 프레임워크
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }

# Robolectric - 안드로이드 컴포넌트를 JVM에서 테스트
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# === 계측 테스트 (Instrumented Test) ===
# AndroidX Test - 안드로이드 테스트 기본 라이브러리
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }

# Espresso - UI 테스트 프레임워크
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Compose UI 테스트
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Baseline Profile
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version = "2.3.0" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineprofile" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }

# Navigation 테스트
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "androidxComposeNavigation" }

# Hilt 테스트
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Room 테스트
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }

kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
material = { group = "com.google.android.material", name = "material", version.ref = "materialVersion" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }

[bundles]
compose = [
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-ui-test-manifest"
]

[plugins]
# 안드로이드 앱(Application)을 빌드하기 위한 플러그인
android-application = { id = "com.android.application", version.ref = "agp" }

android-library = { id = "com.android.library", version.ref = "agp" }

# 안드로이드에서 Kotlin 언어를 사용할 수 있도록 설정해주는 플러그인
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

android-test = { id = "com.android.test", version.ref = "agp" }

# Jetpack Compose를 Android뿐 아니라, Desktop, Web 등에서도 사용할 수 있게 도와주는 플러그인
# Multiplatform 프로젝트에서는 Compose 설정을 간소화하기 위해 거의 필수로 사용
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Kotlin 코드를 JVM 위에서 실행할 수 있게 컴파일해주는 플러그인
# Android 앱 개발에서는 보통 "org.jetbrains.kotlin.android" 사용
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }

room = { id = "androidx.room", version.ref = "room" }

baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }

# Firebase Crashlytics
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }

# Google Play OSS Licenses Plugin
play-services-oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }

my-android-application = { id = "my.android.application", version = "unspecified" }
my-android-library = { id = "my.android.library", version = "unspecified" }
my-android-compose = { id = "my.android.compose", version = "unspecified" }
my-hilt = { id = "my.hilt", version = "unspecified" }
my-android-room = { id = "my.android.room", version = "unspecified" }
my-android-presentation-ui = { id = "my.android.presentation.ui", version = "unspecified" }
my-kotlin-library = { id = "my.kotlin.library", version = "unspecified" }