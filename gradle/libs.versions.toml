[versions]
# Project versions
projectApplicationId = "com.jm.focustimer"
projectVersionName = "1.0"
projectVersionCode = "1"
projectMinSdkVersion = "26"
projectTargetSdkVersion = "36"
projectCompileSdkVersion = "36"

agp = "8.13.0"
kotlin = "2.2.20"
coreKtx = "1.17.0"
lifecycleRuntimeKtx = "2.9.4"

activityCompose = "1.11.0"
composeBom = "2025.10.00"
androidxComposeMaterial3 = "1.4.0"

kotlinxCoroutines = "1.10.2"
kotlinxDatetime = "0.7.1"
dataStore = "1.1.7"

hilt = "2.57.2"
hiltNavigationCompose = "1.3.0"
ksp = "2.3.0"
room = "2.8.2"

# LogUtil Library
jmlogVer = "1.0.1"

appcompat = "1.7.1"
material = "1.13.0"
jetbrainsKotlinJvm = "2.2.20"

# Testing
junit4 = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotest = "6.0.4"
mockk = "1.14.6"
turbine = "1.2.1"
truth = "1.6.2"
robolectric = "4.16"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Android Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx"}
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx"}
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxComposeMaterial3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# DataStore
androidx-dataStore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }
androidx-dataStore-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "dataStore" }

# Kotlin Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Kotlin Reflection
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# LogUtil library
jmlog = { group = "com.github.bellmin0203", name = "jmlog", version.ref = "jmlogVer" }

# Hilt
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt"}
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt"}
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# === 단위 테스트 (Unit Test) ===
# JUnit4 - 기본 테스트 프레임워크
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

# Kotlin Coroutines Test - 코루틴 테스트 지원
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# MockK - Kotlin용 Mocking 라이브러리
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }

# Turbine - Flow 테스트를 쉽게 해주는 라이브러리
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Google Truth - 읽기 쉬운 어설션 라이브러리
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

# Kotest - Kotlin 스타일 테스트 프레임워크
kotest-runner-junit5 = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }

# Robolectric - 안드로이드 컴포넌트를 JVM에서 테스트
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# === 계측 테스트 (Instrumented Test) ===
# AndroidX Test - 안드로이드 테스트 기본 라이브러리
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }

# Espresso - UI 테스트 프레임워크
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Compose UI 테스트
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Hilt 테스트
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Room 테스트
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[bundles]
compose = [
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-ui-test-manifest"
]

[plugins]
# 안드로이드 앱(Application)을 빌드하기 위한 플러그인
android-application = { id = "com.android.application", version.ref = "agp" }

android-library = { id = "com.android.library", version.ref = "agp" }

# 안드로이드에서 Kotlin 언어를 사용할 수 있도록 설정해주는 플러그인
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# Jetpack Compose를 Android뿐 아니라, Desktop, Web 등에서도 사용할 수 있게 도와주는 플러그인
# Multiplatform 프로젝트에서는 Compose 설정을 간소화하기 위해 거의 필수로 사용
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Kotlin 코드를 JVM 위에서 실행할 수 있게 컴파일해주는 플러그인
# Android 앱 개발에서는 보통 "org.jetbrains.kotlin.android" 사용
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrainsKotlinJvm" }

room = { id = "androidx.room", version.ref = "room" }

my-android-application = { id = "my.android.application", version = "unspecified" }
my-android-library = { id = "my.android.library", version = "unspecified" }
my-android-compose = { id = "my.android.compose", version = "unspecified" }
my-hilt = { id = "my.hilt", version = "unspecified" }
my-android-room = { id = "my.android.room", version = "unspecified" }
my-android-presentation-ui = { id = "my.android.presentation.ui", version = "unspecified" }
my-kotlin-library = { id = "my.kotlin.library", version = "unspecified" }

